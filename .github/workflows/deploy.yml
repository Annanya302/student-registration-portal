name: Student Registration Portal CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Required for GitHub OIDC
permissions:
  contents: read
  id-token: write


# ============================================================
# CI JOB
# ============================================================

jobs:

  test:
    name: Build and Validate
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout GitHub repository
      # --------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        run: npm ci


      # --------------------------------------------------------
      # Check server.js syntax
      # --------------------------------------------------------
      - name: Check server.js syntax
        run: node --check server.js


      # --------------------------------------------------------
      # Run tests if available
      # --------------------------------------------------------
      - name: Run tests if available
        run: npm test --if-present


# ============================================================
# CD JOB
# ============================================================

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    # Deploy only if CI job succeeds
    needs: test

    steps:

      # ======================================================
      # TEMPORARY OIDC DEBUGGING
      # ======================================================
      #
      # This step is added to find the exact OIDC claims
      # GitHub is sending to AWS.
      #
      # IMPORTANT:
      # Do NOT print the complete OIDC token.
      #
      # ======================================================

      - name: Debug OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log("OIDC issuer:", payload.iss);
            console.log("OIDC audience:", payload.aud);
            console.log("OIDC subject:", payload.sub);
            console.log("Repository:", payload.repository);
            console.log("Repository ID:", payload.repository_id);
            console.log("Repository owner ID:", payload.repository_owner_id);


      # ======================================================
      # CONFIGURE AWS CREDENTIALS
      # ======================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}


      # ======================================================
      # VERIFY AWS AUTHENTICATION
      # ======================================================

      - name: Verify AWS identity
        run: |
          echo "AWS authentication successful."
          aws sts get-caller-identity


      # ======================================================
      # DEPLOY TO EC2 USING SSM
      # ======================================================

      - name: Deploy to EC2 using SSM
        shell: bash
        run: |

          echo "=========================================="
          echo "Starting deployment"
          echo "=========================================="


          # --------------------------------------------------
          # Send deployment command to EC2 instances
          # --------------------------------------------------

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:App,Values=student-registration-portal" \
            --max-concurrency "1" \
            --max-errors "0" \
            --parameters 'commands=[
              "set -e",
              "echo ==========================================",
              "echo Deployment started on $(hostname)",
              "echo ==========================================",
              "cd /home/ssm-user/HA-Web/student-registration-portal",
              "echo Current directory:",
              "pwd",
              "echo Pulling latest code from GitHub...",
              "git fetch origin",
              "git reset --hard origin/main",
              "echo Installing production dependencies...",
              "/usr/bin/npm install --production",
              "echo Restarting Student Registration Portal...",
              "sudo systemctl restart student-registration.service",
              "echo Waiting for application to start...",
              "sleep 10",
              "echo Checking systemd service...",
              "sudo systemctl is-active student-registration.service",
              "echo Checking application health...",
              "curl -f http://localhost:3000/api/health",
              "echo ==========================================",
              "echo Deployment successful on $(hostname)",
              "echo =========================================="
            ]' \
            --comment "GitHub Actions deployment of Student Registration Portal" \
            --query "Command.CommandId" \
            --output text)


          echo "SSM Command ID: $COMMAND_ID"

          echo "=========================================="
          echo "Waiting for deployment to complete..."
          echo "=========================================="


          # ==================================================
          # WAIT FOR SSM DEPLOYMENT
          # ==================================================

          while true; do

            STATUS_OUTPUT=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --details \
              --query "CommandInvocations[*].Status" \
              --output text)

            echo "Current deployment status:"
            echo "$STATUS_OUTPUT"


            # ------------------------------------------------
            # Check for failure
            # ------------------------------------------------

            if echo "$STATUS_OUTPUT" | grep -qE \
              "Failed|TimedOut|Cancelled|Cancelling"; then

              echo "=========================================="
              echo "Deployment FAILED"
              echo "=========================================="

              echo "Fetching deployment details..."

              aws ssm list-command-invocations \
                --command-id "$COMMAND_ID" \
                --details

              exit 1
            fi


            # ------------------------------------------------
            # Check whether deployment succeeded
            # ------------------------------------------------

            if [ -n "$STATUS_OUTPUT" ] && \
              ! echo "$STATUS_OUTPUT" | grep -qE \
              "Pending|InProgress|Delayed|Cancelling"; then

              if ! echo "$STATUS_OUTPUT" | grep -q "Success"; then

                echo "=========================================="
                echo "Deployment did not complete successfully."
                echo "=========================================="

                aws ssm list-command-invocations \
                  --command-id "$COMMAND_ID" \
                  --details

                exit 1

              fi

              echo "=========================================="
              echo "Deployment completed successfully"
              echo "=========================================="

              break
            fi


            # ------------------------------------------------
            # Wait before checking again
            # ------------------------------------------------

            sleep 10

          done


      # ======================================================
      # FINAL SUCCESS MESSAGE
      # ======================================================

      - name: Deployment successful
        run: |

          echo ""
          echo "=========================================="
          echo " Student Registration Portal Deployed!"
          echo "=========================================="
          echo ""

          echo "Deployment flow:"
          echo "GitHub"
          echo "   ↓"
          echo "GitHub Actions"
          echo "   ↓"
          echo "GitHub OIDC"
          echo "   ↓"
          echo "AWS IAM Role"
          echo "   ↓"
          echo "AWS Systems Manager"
          echo "   ↓"
          echo "EC2 instances in ASG"
          echo "   ↓"
          echo "Node.js Application"
          echo ""

          echo "Deployment completed successfully."
name: Deploy Student Registration Portal

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: |
          echo "===== AWS IDENTITY ====="
          aws sts get-caller-identity

      - name: Deploy application using SSM
        shell: bash
        run: |

          echo "===== PREPARING DEPLOYMENT SCRIPT ====="

          DEPLOY_SCRIPT=$(cat <<'EOF'
          set -e

          APP_DIR="/home/ssm-user/HA-Web/student-registration-portal"

          echo "===== INSTANCE ====="

          TOKEN=$(curl -sS -X PUT \
            -H "X-aws-ec2-metadata-token-ttl-seconds: 21600" \
            http://169.254.169.254/latest/api/token)

          INSTANCE_ID=$(curl -sS \
            -H "X-aws-ec2-metadata-token: $TOKEN" \
            http://169.254.169.254/latest/meta-data/instance-id)

          echo "$INSTANCE_ID"

          echo "===== APPLICATION ====="

          cd "$APP_DIR"

          echo "===== FETCH GITHUB ====="

          sudo -u ssm-user git fetch origin

          echo "===== SYNCHRONIZE MAIN ====="

          sudo -u ssm-user git reset --hard origin/main

          echo "===== INSTALL DEPENDENCIES ====="

          sudo -u ssm-user npm ci

          echo "===== RESTART APPLICATION ====="

          sudo -u ssm-user pm2 restart student-registration

          echo "===== PM2 STATUS ====="

          sudo -u ssm-user pm2 status

          echo "===== APPLICATION HEALTH ====="

          curl -sS -f http://localhost:3000/api/health

          echo

          echo "===== DEPLOYMENT SUCCESS ====="

          echo "COMMIT=$(sudo -u ssm-user git rev-parse --short HEAD)"
          EOF
          )

          echo "===== SENDING COMMAND TO EC2 INSTANCES ====="

          PARAMETERS=$(jq -n \
            --arg script "$DEPLOY_SCRIPT" \
            '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:App,Values=student-registration-portal" \
            --parameters "$PARAMETERS" \
            --comment "Deploy Student Registration Portal from GitHub Actions" \
            --query "Command.CommandId" \
            --output text)

          echo "COMMAND_ID=$COMMAND_ID"

          echo "===== WAITING FOR EC2 DEPLOYMENT ====="

          for i in {1..30}; do

            echo
            echo "----- CHECK $i -----"

            aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --details \
              --query 'CommandInvocations[].{InstanceId:InstanceId,Status:Status}' \
              --output table

            STATUSES=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --details \
              --query 'CommandInvocations[].Status' \
              --output text)

            if [ -z "$STATUSES" ]; then
              echo "Waiting for SSM invocations..."
              sleep 10
              continue
            fi

            echo "Current statuses:"
            echo "$STATUSES"

            if echo "$STATUSES" | grep -Eq 'Failed|Cancelled|TimedOut|Cancelling|Undeliverable|Terminated'; then
              echo "===== DEPLOYMENT FAILED ====="
              exit 1
            fi

            if ! echo "$STATUSES" | grep -Eq 'Pending|InProgress|Delayed'; then
              echo "===== ALL EC2 DEPLOYMENTS COMPLETED ====="
              break
            fi

            sleep 10

          done

          echo
          echo "===== FINAL SSM RESULTS ====="

          aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --details \
            --query 'CommandInvocations[].{InstanceId:InstanceId,Status:Status}' \
            --output table

          FINAL_STATUSES=$(aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --details \
            --query 'CommandInvocations[].Status' \
            --output text)

          if echo "$FINAL_STATUSES" | grep -Eq 'Pending|InProgress|Delayed'; then
            echo "===== DEPLOYMENT TIMEOUT ====="
            exit 1
          fi

          if echo "$FINAL_STATUSES" | grep -Eq 'Failed|Cancelled|TimedOut|Cancelling|Undeliverable|Terminated'; then
            echo "===== DEPLOYMENT FAILED ====="
            exit 1
          fi

          echo "===== DEPLOYMENT SUCCESS ====="